services:
  - type: web
    name: auraspeak
    runtime: docker
    plan: free
    envVars:
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: groq/compound-mini
      - key: STT_BACKEND
        value: deepgram
      - key: TTS_ENGINE
        value: deepgram
      - key: DEEPGRAM_STT_MODEL
        value: nova-2
      - key: DEEPGRAM_TTS_MODEL
        value: aura-2-pluto-en
      - key: DEEPGRAM_TTS_SAMPLE_RATE
        value: "48000"
