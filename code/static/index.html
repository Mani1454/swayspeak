<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>SwaySpeak | Interactive AI English Tutor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;500;700;900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --neon-primary: #00f0ff;
      --neon-secondary: #7000ff;
      --brand-pink: #ff0055;
      --neon-danger: #ff2a6d;
      /* New color for reset */
      --text-main: #ffffff;
      --text-muted: #8892b0;
      --bg-dark: #030305;
      --bg-panel: rgba(10, 12, 16, 0.7);
      --border-color: rgba(0, 240, 255, 0.15);
      --glass: blur(20px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scrollbar-width: none;
    }

    ::-webkit-scrollbar {
      display: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* --- ANIMATED GRID BACKGROUND --- */
    .grid-bg {
      position: absolute;
      width: 200vw;
      height: 200vh;
      top: -50%;
      left: -50%;
      background-image:
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      transform: perspective(500px) rotateX(60deg);
      animation: gridMove 20s linear infinite;
      z-index: 0;
      pointer-events: none;
      transition: animation-duration 2s ease;
    }

    body.session-active .grid-bg {
      animation-duration: 2s;
      background-image:
        linear-gradient(rgba(0, 240, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.06) 1px, transparent 1px);
    }

    @keyframes gridMove {
      0% {
        transform: perspective(500px) rotateX(60deg) translateY(0);
      }

      100% {
        transform: perspective(500px) rotateX(60deg) translateY(40px);
      }
    }

    /* --- MAIN LAYOUT --- */
    .app-container {
      position: relative;
      z-index: 1;
      display: flex;
      height: 100%;
      width: 100%;
    }

    /* --- SIDEBAR --- */
    .sidebar {
      width: 350px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-color);
      backdrop-filter: var(--glass);
      display: flex;
      flex-direction: column;
      transition: transform 0.4s ease;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 2px;
      color: var(--neon-primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logs-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
    }

    .log-entry {
      padding: 10px;
      border-left: 2px solid transparent;
      animation: fadeIn 0.3s ease;
    }

    .log-entry.user {
      border-left-color: var(--neon-primary);
      background: linear-gradient(90deg, rgba(0, 240, 255, 0.05), transparent);
    }

    .log-entry.assistant {
      border-left-color: var(--neon-secondary);
      background: linear-gradient(90deg, rgba(112, 0, 255, 0.05), transparent);
    }

    .log-role {
      font-size: 0.7rem;
      text-transform: uppercase;
      opacity: 0.6;
      margin-bottom: 4px;
      display: block;
    }

    /* --- MAIN STAGE --- */
    .main-stage {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* HEADER UI */
    .hud-header {
      position: absolute;
      top: 0;
      width: 100%;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-img {
      height: 38px;
      width: auto;
      display: block;
      filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.4));
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--neon-primary);
      border: 1px solid var(--border-color);
      padding: 5px 12px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.3);
    }

    .dot {
      width: 6px;
      height: 6px;
      background: var(--neon-primary);
      border-radius: 50%;
    }

    .dot.blink {
      animation: blink 2s infinite;
    }

    /* --- THE CORE --- */
    .core-wrapper {
      position: relative;
      width: 340px;
      height: 340px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #visualizerCanvas {
      position: absolute;
      top: -20%;
      left: -20%;
      width: 140%;
      height: 140%;
      pointer-events: none;
      opacity: 0.6;
      mix-blend-mode: screen;
      z-index: 1;
    }

    /* Animated Rings */
    .core-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid transparent;
      pointer-events: none;
      transition: all 0.5s ease;
    }

    .ring-1 {
      width: 180px;
      height: 180px;
      border-top: 2px solid var(--neon-primary);
      border-right: 2px solid transparent;
      animation: spin 10s linear infinite;
      z-index: 5;
      opacity: 0.6;
    }

    .ring-2 {
      width: 240px;
      height: 240px;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      animation: spinReverse 20s linear infinite;
      z-index: 4;
    }

    .ring-3 {
      width: 300px;
      height: 300px;
      border-left: 4px solid rgba(0, 240, 255, 0.1);
      border-right: 4px solid rgba(0, 240, 255, 0.1);
      animation: spin 30s linear infinite;
      z-index: 3;
    }

    /* Core Button */
    .core-btn {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, #1a1a1a, #000);
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      cursor: pointer;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .core-btn::before {
      content: '';
      position: absolute;
      width: 90%;
      height: 90%;
      border-radius: 50%;
      border: 2px solid var(--neon-primary);
      border-top-color: transparent;
      border-bottom-color: transparent;
      animation: spin 4s linear infinite;
      opacity: 0.3;
      transition: all 0.3s;
    }

    .core-icon {
      color: var(--neon-primary);
      transition: all 0.3s;
      filter: drop-shadow(0 0 5px var(--neon-primary));
    }

    /* Animation States */
    .core-wrapper.active .core-btn {
      box-shadow: 0 0 60px var(--neon-primary), inset 0 0 30px var(--neon-primary);
      border-color: var(--neon-primary);
      transform: scale(1.05);
    }

    .core-wrapper.active .ring-1 {
      border-top-color: var(--neon-primary);
      border-bottom-color: var(--neon-primary);
      animation-duration: 1s;
      opacity: 1;
      box-shadow: 0 0 15px var(--neon-primary);
    }

    .core-wrapper.active .ring-2 {
      border-color: rgba(0, 240, 255, 0.6);
      animation-duration: 2.5s;
    }

    .core-wrapper.active .ring-3 {
      animation-duration: 5s;
      border-color: rgba(0, 240, 255, 0.3);
    }

    .core-wrapper.active .core-btn::before {
      opacity: 1;
      border-width: 3px;
      animation-duration: 0.8s;
    }

    .core-wrapper.speaking .core-btn {
      box-shadow: 0 0 100px var(--neon-secondary), inset 0 0 40px var(--neon-secondary);
      border-color: var(--neon-secondary);
      animation: shockwave 1s infinite;
    }

    .core-wrapper.speaking .core-icon {
      color: var(--neon-secondary);
      filter: drop-shadow(0 0 15px var(--neon-secondary));
    }

    .core-wrapper.speaking .ring-1 {
      border-color: var(--neon-secondary);
      animation-duration: 0.5s;
      box-shadow: 0 0 25px var(--neon-secondary);
    }

    /* LIVE TEXT */
    .live-transcript {
      margin-top: 40px;
      text-align: center;
      width: 80%;
      max-width: 700px;
      min-height: 80px;
      z-index: 5;
    }

    .transcript-text {
      font-size: 1.8rem;
      font-weight: 300;
      line-height: 1.4;
      background: linear-gradient(180deg, #fff, #aaa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.4s ease;
      text-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }

    .transcript-text.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .transcript-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--neon-primary);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    /* CONTROLS */
    .control-dock {
      position: absolute;
      bottom: 60px;
      /* Removed background/border for cleaner "floating" look */
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 5;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.2s;
      padding: 5px;
    }

    .icon-btn:hover {
      color: #fff;
    }

    /* --- NEW HEX-PURGE BUTTON --- */
    .hex-btn {
      position: relative;
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.03);
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      transition: all 0.3s ease;
    }

    .hex-btn::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      right: 2px;
      bottom: 2px;
      background: var(--bg-dark);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      z-index: 1;
    }

    /* Rotating Border */
    .hex-btn::after {
      content: '';
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      background: conic-gradient(from 0deg, transparent 0%, var(--text-muted) 50%, transparent 100%);
      animation: spin 4s linear infinite;
      z-index: 0;
    }

    .hex-btn:hover::after {
      background: conic-gradient(from 0deg, transparent 0%, var(--neon-danger) 50%, transparent 100%);
      animation: spin 1s linear infinite;
      /* Panic mode speed */
    }

    .hex-btn svg {
      position: relative;
      z-index: 2;
      color: var(--text-muted);
      transition: all 0.3s;
    }

    .hex-btn:hover svg {
      color: var(--neon-danger);
      transform: scale(1.1);
      filter: drop-shadow(0 0 5px var(--neon-danger));
    }

    .hex-btn:active {
      transform: scale(0.9);
    }

    .footer-credits {
      position: absolute;
      bottom: 15px;
      width: 100%;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-muted);
      opacity: 0.6;
      z-index: 5;
    }

    .footer-credits a {
      color: var(--neon-primary);
      text-decoration: none;
      transition: all 0.2s;
    }

    .footer-credits a:hover {
      text-shadow: 0 0 8px var(--neon-primary);
      color: #fff;
    }

    .mobile-toggle {
      display: none;
    }

    @media (max-width: 768px) {
      .sidebar {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 100;
        transform: translateX(-100%);
        width: 85%;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .mobile-toggle {
        display: block;
      }

      .transcript-text {
        font-size: 1.3rem;
      }

      .core-wrapper {
        width: 280px;
        height: 280px;
      }
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes spinReverse {
      100% {
        transform: rotate(-360deg);
      }
    }

    @keyframes blink {
      50% {
        opacity: 0.3;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateX(-10px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes shockwave {
      0% {
        box-shadow: 0 0 0 0 rgba(112, 0, 255, 0.4);
      }

      70% {
        box-shadow: 0 0 0 30px rgba(112, 0, 255, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(112, 0, 255, 0);
      }
    }

    /* --- GRAMMAR FEEDBACK CARD (INLINE IN USER MESSAGE) --- */
    .grammar-card {
      margin-top: 10px;
      padding: 10px 14px;
      background: linear-gradient(135deg, rgba(255, 170, 0, 0.08), rgba(255, 0, 85, 0.03));
      border: 1px solid rgba(255, 170, 0, 0.35);
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      animation: fadeIn 0.3s ease;
      box-shadow: 0 4px 16px rgba(255, 170, 0, 0.08);
    }

    .grammar-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 170, 0, 0.15);
    }

    .grammar-badge {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffaa00;
      text-transform: uppercase;
    }

    .grammar-pill {
      font-size: 0.6rem;
      background: rgba(255, 170, 0, 0.2);
      color: #ffaa00;
      padding: 2px 6px;
      border-radius: 3px;
      letter-spacing: 0.5px;
    }

    .grammar-card-body {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.78rem;
    }

    .grammar-row {
      display: flex;
      gap: 8px;
      align-items: baseline;
      line-height: 1.4;
    }

    .grammar-tag {
      font-size: 0.68rem;
      text-transform: uppercase;
      opacity: 0.6;
      min-width: 55px;
    }

    .original-row .grammar-tag {
      color: var(--neon-danger);
    }

    .original-text {
      color: #ff7788;
      text-decoration: line-through;
      opacity: 0.85;
    }

    .corrected-row .grammar-tag {
      color: var(--neon-primary);
    }

    .corrected-text {
      color: var(--neon-primary);
      font-weight: 600;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }

    .explanation-row .grammar-tag {
      color: #ffd166;
    }

    .explanation-text {
      color: #ddd;
      font-size: 0.74rem;
    }

    /* --- HUD TOAST NOTIFICATION --- */
    .hud-toast {
      position: absolute;
      top: 75px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 90%;
      width: 500px;
      background: rgba(15, 17, 23, 0.92);
      border: 1px solid rgba(255, 170, 0, 0.45);
      border-radius: 8px;
      padding: 12px 16px;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 24px rgba(255, 170, 0, 0.2);
      z-index: 100;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-family: 'JetBrains Mono', monospace;
      animation: slideDownToast 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .hud-toast.hide {
      opacity: 0;
      transform: translate(-50%, -20px);
    }

    @keyframes slideDownToast {
      from {
        opacity: 0;
        transform: translate(-50%, -20px);
      }
      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    .hud-toast-icon {
      font-size: 1.2rem;
      line-height: 1;
      padding-top: 2px;
    }

    .hud-toast-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .hud-toast-title {
      font-size: 0.65rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #ffaa00;
      font-weight: 700;
    }

    .hud-toast-corrected {
      color: var(--neon-primary);
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.3;
    }

    .hud-toast-explanation {
      color: #bbb;
      font-size: 0.72rem;
      line-height: 1.35;
    }

    .hud-toast-close {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      padding: 2px 6px;
      transition: color 0.2s;
    }

    .hud-toast-close:hover {
      color: #fff;
    }

    /* CHAT INPUT BAR */
    .chat-input-wrapper {
      margin-top: 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      width: min(560px, 90%);
      background: rgba(10, 12, 16, 0.75);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 5px 14px;
      backdrop-filter: var(--glass);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      transition: border-color 0.3s, box-shadow 0.3s;
      z-index: 10;
    }

    .chat-input-wrapper:focus-within {
      border-color: var(--neon-primary);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
    }

    .chat-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      padding: 8px 12px;
    }

    .chat-input::placeholder {
      color: var(--text-muted);
      opacity: 0.7;
    }

    .send-btn {
      background: transparent;
      border: none;
      color: var(--neon-primary);
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }

    .send-btn:hover {
      background: rgba(0, 240, 255, 0.15);
      transform: scale(1.1);
    }
  </style>
</head>

<body>

  <div class="grid-bg"></div>

  <div class="app-container">

    <nav class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span>SESSION LOGS</span>
        <button class="icon-btn" id="closeSidebarBtn" style="display:none;">✕</button>
      </div>
      <div class="logs-container" id="messagesList">
        <div class="log-entry system">
          <span class="log-role">SYSTEM</span>
          Welcome to SwaySpeak English Tutor. Tap the glowing core to start practicing your spoken English!
        </div>
      </div>
    </nav>

    <main class="main-stage">

      <!-- HUD TOAST FOR CONDITIONAL GRAMMAR COACHING -->
      <div id="hudToast" class="hud-toast" style="display: none;">
        <div class="hud-toast-icon">💡</div>
        <div class="hud-toast-content">
          <div class="hud-toast-title">Grammar Tip</div>
          <div class="hud-toast-corrected" id="hudToastCorrected"></div>
          <div class="hud-toast-explanation" id="hudToastExplanation"></div>
        </div>
        <button class="hud-toast-close" id="hudToastClose" title="Dismiss">✕</button>
      </div>

      <div class="hud-header">
        <button class="icon-btn mobile-toggle" id="menuBtn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12h18M3 6h18M3 18h18" />
          </svg>
        </button>

        <!-- IMAGE LOGO -->
        <img src="/static/swayspeak_logo.png?v=2" alt="SwaySpeak Logo" class="logo-img">

        <div class="status-indicator">
          <div class="dot blink" id="statusDot"></div>
          <span id="statusText">OFFLINE</span>
        </div>
      </div>

      <div class="core-wrapper" id="orbContainer">
        <canvas id="visualizerCanvas"></canvas>
        <div class="core-ring ring-1"></div>
        <div class="core-ring ring-2"></div>
        <div class="core-ring ring-3"></div>

        <div class="core-btn" id="startBtn">
          <svg class="core-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
            <line x1="12" y1="2" x2="12" y2="12"></line>
          </svg>
        </div>
      </div>

      <div class="live-transcript">
        <div class="transcript-label" id="transcriptLabel">READY</div>
        <div class="transcript-text" id="liveText">Initialize Sequence</div>
      </div>

      <div class="control-dock">
        <!-- NEW HEX-PURGE BUTTON -->
        <button class="hex-btn" id="resetBtn" title="PURGE SYSTEM CONTEXT">
          <!-- Brain Reset Icon -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path
